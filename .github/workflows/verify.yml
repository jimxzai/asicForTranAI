# CI for the reference kernel, formal proofs and the claims audit.
# Required: kernel tests. Best-effort (continue-on-error until the toolchains are
# confirmed working in CI): SPARK and Lean. None of these jobs print hard-coded results.

name: Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  kernel-tests:
    name: Reference kernel tests (required)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install gfortran
      run: sudo apt-get update && sudo apt-get install -y gfortran
    - name: Tests (exhaustive pack/unpack, bit-exact matmul, overflow bound)
      run: make -C kernel3p5 test
    - name: Benchmark (informational, shared CI hardware)
      run: make -C kernel3p5 bench

  spark-proofs:
    name: SPARK proofs (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: alire-project/setup-alire@v3
    - name: Install GNAT toolchain and GNATprove
      run: |
        alr -n toolchain --select gnat_native gprbuild
        alr -n install gnatprove
        echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
    - name: Run GNATprove (fails if any check is unproved). Same commands as docs/INSTALL_GNAT.md.
      run: make -C spark-llama-safety prove

  lean-proofs:
    name: Lean build (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: leanprover/lean-action@v1
      with:
        lake-package-directory: lean-kernel
    - name: Fail on sorry
      run: |
        if grep -rn "sorry" --include='*.lean' lean-kernel/LeanKernel lean-kernel/LeanKernel.lean; then
          echo "Unproven goals present"; exit 1
        fi

  claims-audit:
    name: Claims audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - run: ./scripts/claims_audit.sh
